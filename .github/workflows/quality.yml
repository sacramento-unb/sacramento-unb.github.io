name: Verify portfolio
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check && npm run build && npm run test:links
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm audit --audit-level=high
